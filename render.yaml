services:
  - type: web
    name: quikimpo-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: cd quikimpo-backend/quikimpo-main && pip install -r requirements.txt && python manage.py migrate --noinput 2>/dev/null || true && python manage.py collectstatic --noinput 2>/dev/null || true && python manage.py loaddata freight/fixtures/demo_shipments.json 2>/dev/null || true
    startCommand: cd quikimpo-backend/quikimpo-main && python -m gunicorn pos_system.wsgi:application --log-file - --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11
    routes:
      - path: /
        matchType: prefix
  
  - type: pserv
    name: quikimpo-postgres
    runtime: postgres15
    ipAllowList: []
    postgreSQLVersion: "15"
